# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this repo in Render → New → Blueprint → apply this file.
#
# Production: Standard + horizontal autoscaling (Render Pro workspace) + Redis.
# Set GOOGLE_API_KEY, POLYGON_API_KEY, FINNHUB_API_KEY in the Render dashboard.
#
# After deploy, set VITE_API_BASE on Vercel to this service's URL.

services:
  - type: keyvalue
    name: thetalens-redis
    plan: starter
    ipAllowList: [] # internal Render network only

  - type: web
    name: thetalens-api
    runtime: python
    region: oregon
    plan: standard
    maxShutdownDelaySeconds: 120
    scaling:
      minInstances: 2
      maxInstances: 6
      targetCPUPercent: 70
      targetMemoryPercent: 65
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: LLM_ACTIVE
        value: gemini
      - key: GOOGLE_MODEL
        value: flash
      - key: APP_ENV
        value: production
      - key: GOOGLE_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://thetalens.app,https://www.thetalens.app
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: thetalens-redis
          property: connectionString
