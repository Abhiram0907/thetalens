# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this repo in Render → New → Blueprint → apply this file.
#
# After deploy, set CORS_ORIGINS on the API to your Vercel URL(s), then set
# VITE_API_BASE on Vercel to this service's URL (see docs/DEPLOYMENT.md).

services:
  - type: web
    name: thetalens-api
    runtime: python
    region: oregon
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: LLM_ACTIVE
        value: gemini
      - key: GOOGLE_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
